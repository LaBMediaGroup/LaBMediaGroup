<script>
/* The four notebook lists became one page. This file stays so links,
   bookmarks and anything already indexed keep landing on the right band
   rather than a 404. Any ?q= is carried across: search used to hand off
   between these pages, and those links are still out in the world. */
(function(){
  try{
    var m = /[?&]q=([^&]*)/.exec(location.search);
    var q = m ? ('?q=' + m[1]) : '';
    location.replace('resources.html' + q + '#band-gear');
  }catch(e){ location.replace('resources.html#band-gear'); }
})();
</script>

</main>
