<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){var K="lab-theme-v2",O="lab-theme",M={stone:"sepia",sepia:"timber"};try{var t=localStorage.getItem(K);if(t===null){var l=localStorage.getItem(O);if(l){t=M[l]||l;localStorage.setItem(K,t);}}if(t&&t!=="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Usage Dashboard | LaB Media</title>
<meta name="robots" content="noindex,nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lab.css">

<style>
/* ═══════════════════════════════════════════
   AI USAGE DASHBOARD
   ═══════════════════════════════════════════ */

/* ── TIME RANGE TOGGLE ── */
.range-bar{text-align:center;margin-bottom:var(--s-5)}
.range-btn{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);background:none;border:1px solid var(--line);
  padding:5px 14px;border-radius:var(--radius);cursor:pointer;margin:0 3px;
  transition:color .3s,border-color .3s,background .3s;
}
.range-btn:hover{color:var(--dim);border-color:var(--line-2)}
.range-btn.active{color:var(--accent);border-color:var(--accent-dim);background:var(--accent-bg)}

.wrap{max-width:820px;margin:0 auto;padding:clamp(32px,5vw,64px) var(--gutter) var(--s-10)}

/* ── BACK TO HOME ── */
.top-bar{margin-bottom:var(--s-5)}
.top-bar a{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);text-decoration:none;transition:color var(--fast) var(--ease);
}
.top-bar a:hover{color:var(--accent)}

/* ── HEADER ── */
.head{text-align:center;margin-bottom:var(--s-7)}
.head h1{
  font-family:var(--f-display);font-weight:400;
  font-size:clamp(32px,5vw,56px);line-height:1.02;letter-spacing:-.03em;margin:0 0 var(--s-2);
}
.head h1 em{font-style:italic;color:var(--accent)}
.head .sub{color:var(--dim);font-size:var(--t-base);line-height:1.6}
.head .meta{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin-top:var(--s-3);
}
.refresh-btn{
  font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent-dim);
  padding:4px 14px;border-radius:var(--radius);cursor:pointer;margin-top:var(--s-3);
  transition:opacity .3s;
}

/* ── VERTICAL BARS (top section) ── */
.bars-section{
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:var(--s-6) var(--s-4) var(--s-5);margin-bottom:var(--s-7);
}
.bars{
  display:flex;gap:var(--s-4);justify-content:center;align-items:flex-end;
  height:130px;
}
.bar-col{
  display:flex;flex-direction:column;align-items:center;gap:var(--s-2);
  flex:1;max-width:72px;height:100%;justify-content:flex-end;cursor:pointer;
  text-decoration:none;
}
.bar-col:hover .bar-track{border-color:var(--line-2)}
.bar-col:hover .bar-name{color:var(--ink)}

.bar-pct{
  font-family:var(--f-mono);font-size:9px;font-weight:700;
  color:var(--ink);letter-spacing:.04em;
}
.bar-track{
  width:100%;max-width:34px;height:100%;background:var(--paper-3);
  border-radius:2px;position:relative;overflow:hidden;
  border:1px solid var(--line);transition:border-color .3s;
}
.bar-level{
  position:absolute;bottom:0;left:0;right:0;border-radius:1px;
  transition:height var(--slow) var(--ease);
}
.bar-level.ok{background:var(--good)}
.bar-level.warn{background:var(--accent)}
.bar-level.crit{background:#E0533A}
.bar-level.unknown{background:var(--faint);opacity:.18}

.bar-name{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink);text-align:center;line-height:1.3;
  transition:color .3s;
}

.bars-cost{
  display:flex;justify-content:center;gap:var(--s-6);margin-top:var(--s-5);
  font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);
}
.bars-cost strong{color:var(--accent);font-weight:400}
.cost-caveat{color:var(--faint);opacity:.75}

/* ── WHAT'S NEW (timeline) ── */
.news-title{
  font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3vw,32px);
  text-align:center;margin-bottom:var(--s-5);letter-spacing:-.02em;
}
.news-title em{font-style:italic;color:var(--accent)}

.timeline{position:relative;padding-left:24px;margin-bottom:var(--s-6)}
.timeline::before{
  content:'';position:absolute;left:5px;top:6px;bottom:6px;
  width:1px;background:var(--line);
}

.tl-day{position:relative;margin-bottom:var(--s-5)}
.tl-day::before{
  content:'';position:absolute;left:-23px;top:0;
  width:11px;height:11px;border-radius:50%;background:var(--accent);
  border:2px solid var(--paper);z-index:1;
}
.tl-day-head{
  font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);margin-bottom:var(--s-3);
}
.tl-item{
  position:relative;padding:6px 0;color:var(--dim);
  font-size:clamp(15px,1.9vw,17px);line-height:1.7;
}
.tl-item::before{
  content:'';position:absolute;left:-19px;top:11px;
  width:5px;height:5px;border-radius:50%;background:var(--line-2);
}
.tl-item strong{color:var(--ink);font-weight:500}
/* hover chip : the timestamp floats in at the right edge, laid over the
   entry's own paper so layout never moves. Taps show it too, for touch. */
.tl-item:hover .tl-time,.tl-item:active .tl-time{opacity:1}
.tl-time{
  position:absolute;right:0;top:6px;pointer-events:none;
  font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;
  color:var(--faint);background:var(--paper);padding:2px 0 2px 10px;
  opacity:0;transition:opacity var(--fast) var(--ease);
}

.tl-more{
  text-align:center;padding:var(--s-3);font-family:var(--f-mono);font-size:var(--t-xs);
  letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  border:1px solid var(--line);border-radius:6px;cursor:pointer;
  transition:color .3s,border-color .3s;
}
.tl-more:hover{color:var(--accent);border-color:var(--accent-dim)}

/* ── PROVIDER DETAILS (anchor targets) ── */
.details-title{
  font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3vw,32px);
  text-align:center;margin:var(--s-8) 0 var(--s-5);letter-spacing:-.02em;
  padding-top:var(--s-5);border-top:1px solid var(--line);
}
.details-title em{font-style:italic;color:var(--accent)}

.provider-detail{
  padding:var(--s-5) var(--s-4);margin-bottom:var(--s-3);
  background:var(--paper-2);border:1px solid var(--line);border-radius:6px;
  scroll-margin-top:var(--s-5);
}
.provider-detail:hover{border-color:var(--line-2)}
.pd-link{display:inline-block;margin-top:var(--s-3);font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-decoration:none;transition:color var(--fast) var(--ease)}
.pd-link:hover{color:var(--accent)}
.pd-updated{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.08em;color:var(--faint);margin-top:var(--s-3);opacity:.7}

/* ── QUOTA WINDOWS & FRESHNESS ── */
.staleness{
  max-width:52ch;margin:var(--s-4) auto 0;padding:var(--s-3) var(--s-4);
  border:1px solid rgba(224,122,95,.4);border-radius:4px;
  background:rgba(224,122,95,.07);
  font-family:var(--f-mono);font-size:10px;line-height:1.6;
  letter-spacing:.04em;color:var(--accent);text-align:left;
}

.pd-avail{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:var(--s-3);
  padding:6px 10px;border-radius:3px;display:inline-block;
}
.pd-avail.open{color:var(--good);background:rgba(126,168,126,.1)}
.pd-avail.blocked{color:#E0533A;background:rgba(224,83,58,.1)}
.pd-avail.unknown{color:var(--faint);background:var(--paper-3)}
.pd-avail.stale{
  color:var(--accent);background:repeating-linear-gradient(45deg,
    rgba(224,122,95,.14) 0 6px, rgba(224,122,95,.05) 6px 12px);
}

.pd-quota{margin-bottom:var(--s-3)}
.pd-quota-top{
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--f-mono);font-size:9px;letter-spacing:.06em;margin-bottom:5px;
}
.pd-quota-label{color:var(--dim);text-transform:uppercase}
.pd-quota-reset{
  font-family:var(--f-mono);font-size:8.5px;color:var(--faint);
  letter-spacing:.04em;margin-top:4px;
}
.pd-prov{float:right;opacity:.7;font-style:italic}

/* Stale bars are hatched, not solid — legible as "don't trust this" at a
   glance, and distinct from the colour-coded live states. */
.pd-bar-fill.stale,.bar-level.stale{
  background:repeating-linear-gradient(45deg,
    var(--accent) 0 4px, transparent 4px 8px);
  opacity:.55;
}
.pct.stale{color:var(--accent);font-style:italic}

.pd-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:var(--s-3)}
.pd-name{font-family:var(--f-display);font-size:var(--t-xl);font-weight:400;color:var(--ink);line-height:1.1}
.pd-name em{font-style:italic;color:var(--accent)}
.pd-tier{
  font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding:2px 8px;border:1px solid var(--line);border-radius:var(--radius);
}

.pd-bar-wrap{position:relative;height:6px;background:var(--paper-3);border-radius:var(--radius);overflow:hidden;margin-bottom:var(--s-2)}
.pd-bar-fill{height:100%;border-radius:var(--radius);transition:width var(--slow) var(--ease)}
.pd-bar-fill.ok{background:var(--good)}
.pd-bar-fill.warn{background:var(--accent)}
.pd-bar-fill.crit{background:#E0533A}
.pd-bar-fill.unknown{background:var(--faint);opacity:.2;width:100%}

.pd-labels{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:9px;letter-spacing:.06em}
.pd-labels .used{color:var(--dim)}
/* Unscoped: .pct is now used inside quota rows too, not just .pd-labels */
.pct.ok{color:var(--good)}
.pct.warn{color:var(--accent)}
.pct.crit{color:#E0533A}
.pct.unknown{color:var(--faint)}
.pd-labels .reset{color:var(--faint);font-size:8.5px}

.pd-info{
  display:flex;flex-wrap:wrap;gap:var(--s-4);margin-top:var(--s-3);
  font-family:var(--f-mono);font-size:8.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--faint);
}
.pd-info span strong{color:var(--dim);font-weight:400}

.pd-models{display:flex;flex-wrap:wrap;gap:5px;margin-top:var(--s-3)}
.pd-model{
  font-family:var(--f-mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 7px;border:1px solid var(--line);color:var(--faint);border-radius:var(--radius);
}
.pd-model.active{color:var(--accent);border-color:var(--accent-dim);background:var(--accent-bg)}

/* ── TOOL CATEGORY LABELS ── */
.tu-cat-label{
  font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);
  margin-top:var(--s-6);margin-bottom:var(--s-3);
  padding-bottom:var(--s-2);border-bottom:1px solid var(--line);
}
.tu-cat-label:first-child{margin-top:0}
.tu-cat-sub{
  font-size:8px;letter-spacing:.08em;color:var(--faint);
  margin-left:var(--s-3);opacity:.7;text-transform:none;font-style:italic;
}

/* ── HIGHLIGHTS / STAT CARDS ── */
.hl-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:var(--s-3);margin-top:var(--s-5);
}
.hl-card{
  background:var(--paper-2);border:1px solid var(--line);border-radius:8px;
  padding:var(--s-4) var(--s-3);text-align:center;
  display:flex;flex-direction:column;gap:3px;align-items:center;
}
.hl-emoji{font-size:24px;line-height:1}
.hl-label{
  font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);
}
.hl-value{
  font-family:var(--f-display);font-size:clamp(20px,2.5vw,28px);
  color:var(--accent);line-height:1.1;
}
.hl-model{
  font-size:var(--t-xs);color:var(--dim);line-height:1.4;
}
.hl-date{
  font-family:var(--f-mono);font-size:8.5px;letter-spacing:.08em;
  color:var(--faint);
}
@media(max-width:480px){
  .hl-grid{grid-template-columns:repeat(2,1fr)}
}

/* ── TOOL USAGE ── */
.tu-total{
  text-align:center;font-family:var(--f-display);
  font-size:clamp(26px,3.4vw,38px);color:var(--ink);
  margin-bottom:var(--s-1);
}
.tu-total em{font-style:italic;color:var(--accent)}
.tu-total-label{
  text-align:center;font-family:var(--f-mono);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  margin-bottom:var(--s-5);
}
.tu-tool{
  padding:var(--s-4) var(--s-4);margin-bottom:var(--s-3);
  background:var(--paper-2);border:1px solid var(--line);border-radius:6px;
}
.tu-head{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:var(--s-2);
}
.tu-name{font-family:var(--f-display);font-size:var(--t-lg);color:var(--ink);font-weight:400}
.tu-tokens{font-family:var(--f-mono);font-size:var(--t-sm);font-weight:700;color:var(--accent)}
.tu-bar{
  height:5px;background:var(--paper-3);border-radius:var(--radius);
  overflow:hidden;margin-bottom:var(--s-3);
}
.tu-fill{height:100%;background:var(--accent);border-radius:var(--radius)}
.tu-models{display:flex;flex-direction:column;gap:5px}
.tu-model{
  display:grid;grid-template-columns:130px 1fr 60px;gap:var(--s-3);
  align-items:center;font-family:var(--f-mono);font-size:9px;
  letter-spacing:.06em;color:var(--dim);
}
.tu-model .m-name{color:var(--ink)}
.tu-model .m-bar{height:3px;background:var(--paper-3);border-radius:2px;overflow:hidden}
.tu-model .m-fill{height:100%;background:var(--dim);border-radius:2px}

/* ── MODEL LEADERBOARD (cross-tool) ── */
.mc-sub{color:var(--faint);font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;margin:calc(-1 * var(--s-3)) 0 var(--s-4)}
.mc-row{margin-bottom:var(--s-3)}
.mc-rank{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;color:var(--faint);width:2ch;flex:none}
.mc-row.top .mc-rank{color:var(--accent)}
.mc-head{display:flex;align-items:baseline;gap:var(--s-3);margin-bottom:4px}
.mc-name{font-size:var(--t-sm);color:var(--ink)}
.mc-provider{font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.mc-tokens{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--dim)}
.mc-bar{height:6px;background:var(--paper-3);border-radius:var(--radius);overflow:hidden}
.mc-fill{height:100%;background:var(--dim);border-radius:var(--radius)}
.mc-row.top .mc-fill{background:var(--accent)}
.mc-row.top .mc-tokens{color:var(--accent)}

/* ── PODIUM (top three models) ── */
.mc-podium{display:flex;gap:var(--s-3);align-items:flex-end;margin:var(--s-5) 0 var(--s-6)}
.mc-podium-card{flex:1;background:var(--paper-2);border:1px solid var(--line);border-radius:8px;
  padding:var(--s-4) var(--s-3);text-align:center;display:flex;flex-direction:column;gap:3px}
.mc-podium-card.first{order:2;padding-top:var(--s-6);padding-bottom:var(--s-6);border-color:var(--accent-dim);background:color-mix(in srgb,var(--accent) 6%,var(--paper-2))}
.mc-podium-card.second{order:1}
.mc-podium-card.third{order:3}
.mc-podium-rank{font-family:var(--f-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.mc-podium-card.first .mc-podium-rank{color:var(--accent)}
.mc-podium-name{font-family:var(--f-display);font-size:clamp(15px,2vw,20px);color:var(--ink);line-height:1.15}
.mc-podium-provider{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.mc-podium-tokens{font-family:var(--f-mono);font-size:clamp(16px,2.2vw,22px);color:var(--dim);margin-top:2px}
.mc-podium-card.first .mc-podium-tokens{color:var(--accent)}
@media (max-width:560px){
  .mc-podium{gap:var(--s-2)}
  .mc-podium-card{padding:var(--s-3) var(--s-2)}
  .mc-podium-card.first{padding-top:var(--s-4);padding-bottom:var(--s-4)}
}
.tu-model .m-fill.top{background:var(--good)}
.tu-model .m-tokens{text-align:right;color:var(--faint)}
@media(max-width:560px){
  .tu-model{grid-template-columns:100px 1fr 50px}
}

/* ── EGG ── */
.egg{text-align:center;padding:var(--s-7) 0;font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.egg a{color:var(--accent);text-decoration:none}

.note-box{
  background:var(--accent-bg);border:1px solid var(--accent-dim);
  padding:var(--s-3) var(--s-4);margin-bottom:var(--s-7);border-radius:6px;
}
.note-box p{color:var(--dim);font-size:var(--t-xs);line-height:1.6;margin:0}

/* Scroll behavior */
html{scroll-behavior:smooth}

/* Highlight pulse when jumped to */
@keyframes highlight-pulse{
  0%{box-shadow:0 0 0 0 var(--accent-dim);border-color:var(--accent)}
  30%{box-shadow:0 0 0 4px var(--accent-dim);border-color:var(--accent)}
  100%{box-shadow:0 0 0 0 transparent;border-color:var(--line)}
}
.provider-detail.flash{
  animation:highlight-pulse 1.4s var(--ease);
}

/* ── FLYING CURSOR ── */
#lab-cursor{
  position:fixed;top:0;left:0;z-index:10000;pointer-events:none;
  opacity:0;transition:opacity .3s;will-change:transform;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));
}
#lab-cursor svg{display:block}
#lab-cursor .ripple{
  position:absolute;left:9px;top:9px;width:8px;height:8px;
  border-radius:50%;border:2px solid var(--accent);
  transform:translate(-50%,-50%) scale(0);opacity:0;
}
@keyframes ripple-out{
  0%{transform:translate(-50%,-50%) scale(.3);opacity:.9}
  100%{transform:translate(-50%,-50%) scale(5);opacity:0}
}
#lab-cursor .ripple.go{animation:ripple-out .6s ease-out forwards}

@media(prefers-reduced-motion:reduce){
  .provider-detail.flash{animation:none;border-color:var(--accent)}
  #lab-cursor{display:none!important}
}
</style>
</head>
<body>

<div class="wrap">

  <div class="top-bar"><a href="index.html">&larr; LaB Media</a></div>

  <!-- ═══ HEADER ═══ -->
  <div class="head">
    <h1>AI Usage <em>Dashboard</em></h1>
    <div class="sub">Provider quotas and site updates.</div>
    <div class="meta" id="lastUpdated">Loading…</div>
    <div class="staleness" id="staleness" style="display:none"></div>
    <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">↻ Refresh</button>
  </div>

  <!-- ═══ TIME RANGE TOGGLE ═══ -->
  <div class="range-bar" id="rangeBar">
    <button class="range-btn" data-range="24h" onclick="setRange('24h')">24h</button>
    <button class="range-btn" data-range="7d" onclick="setRange('7d')">7d</button>
    <button class="range-btn active" data-range="30d" onclick="setRange('30d')">30d</button>
  </div>

  <!-- ═══ VERTICAL BARS ═══ -->
  <div class="bars-section">
    <div class="bars" id="bars-container"></div>
    <div class="bars-cost" id="bars-cost"></div>
  </div>

  <!-- ═══ MODEL LEADERBOARD ═══ -->
  <div id="model-leaderboard"></div>

  <!-- ═══ TOOL USAGE ═══ -->
  <div id="tool-usage"></div>

  <!-- ═══ PROVIDER DETAILS ═══ -->
  <h2 class="details-title">Provider <em>Details</em></h2>
  <div id="details-container"></div>

  <div class="egg">🔒 <a href="/">labmedia.work</a></div>
</div>

<script>
var REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches);
var rawData = null;  // cached full dataset
var currentRange = '30d';

function setRange(range){
  currentRange = range;
  document.querySelectorAll('.range-btn').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-range')===range);
  });
  if(rawData) renderToolUsage(rawData, range);
}

// ── QUOTA FRESHNESS ──────────────────────────────────────────────────
// Freshness is tracked PER QUOTA WINDOW, never from the file's lastUpdated.
//
// The sync job rewrites toolUsage and bumps lastUpdated on every run, but for
// its first four runs it never touched providers[]. One provider read 45% for
// days while every card announced a fresh "Synced" time. The file-level
// timestamp laundered stale data as current. So each quota carries its own
// syncedAt, and anything past its shelf life is reported as unverified rather
// than drawn as a confident bar.
var STALE_AFTER_HOURS = 24;

function ageHours(iso){
  if(!iso) return Infinity;
  var t = new Date(iso).getTime();
  return isNaN(t) ? Infinity : (Date.now() - t) / 36e5;
}

function fmtAge(hours){
  if(hours === Infinity) return 'never';
  if(hours < 1) return Math.max(1, Math.round(hours * 60)) + 'm';
  if(hours < 48) return Math.round(hours) + 'h';
  return Math.round(hours / 24) + 'd';
}

function isStale(q){ return ageHours(q && q.syncedAt) > STALE_AFTER_HOURS; }

function statusForQuota(q){
  var pct = q && q.percentUsed;
  if(typeof pct !== 'number') return 'unknown';
  // A number nobody has verified in a day is not a reading, it's a memory.
  if(isStale(q)) return 'stale';
  if(pct >= 100) return 'crit';
  return pct < 50 ? 'ok' : pct < 80 ? 'warn' : 'crit';
}

// A provider is only as usable as its most-exhausted window: a free 5-hour
// session is worthless when the weekly pool is empty. The headline bar reports
// that binding constraint, not an average and not the first entry.
function bindingQuota(p){
  var quotas = (p.quotas || []).filter(function(q){ return typeof q.percentUsed === 'number'; });
  if(!quotas.length) return null;
  return quotas.reduce(function(worst, q){ return q.percentUsed > worst.percentUsed ? q : worst; });
}

function statusFor(p){ return statusForQuota(bindingQuota(p)); }
function percentFor(p){ var q = bindingQuota(p); return q ? q.percentUsed : 0; }

function fmtCountdown(iso){
  if(!iso) return '';
  var ms = new Date(iso).getTime() - Date.now();
  if(isNaN(ms)) return '';
  if(ms <= 0) return 'now';
  var mins = Math.floor(ms / 6e4), days = Math.floor(mins / 1440), hrs = Math.floor((mins % 1440) / 60);
  if(days) return days + 'd ' + hrs + 'h';
  if(hrs) return hrs + 'h ' + (mins % 60) + 'm';
  return mins + 'm';
}

// The question the page exists to answer: can I actually use this right now?
function availabilityFor(p){
  var quotas = (p.quotas || []).filter(function(q){ return typeof q.percentUsed === 'number'; });
  if(!quotas.length) return {state:'unknown', text:'No reading — check the console'};

  // Refuse to answer rather than answer from stale data.
  var stale = quotas.filter(isStale);
  if(stale.length){
    var freshest = Math.min.apply(null, stale.map(function(q){ return ageHours(q.syncedAt); }));
    return {state:'stale', text:'Unverified · last read ' + fmtAge(freshest) + ' ago'};
  }

  var blocked = quotas.filter(function(q){ return q.percentUsed >= 100; });
  if(!blocked.length){
    var worst = bindingQuota(p);
    return {state:'open', text:'Usable now · ' + (100 - Math.round(worst.percentUsed)) + '% headroom'};
  }
  var withReset = blocked.filter(function(q){ return q.resetsAt; })
    .sort(function(a,b){ return new Date(a.resetsAt) - new Date(b.resetsAt); });
  if(!withReset.length) return {state:'blocked', text:'Blocked · ' + blocked[0].label + ' spent'};
  return {state:'blocked', text:'Blocked · ' + withReset[0].label + ' frees up in ' + fmtCountdown(withReset[0].resetsAt)};
}

function staleQuotas(providers){
  var out = [];
  providers.forEach(function(p){
    (p.quotas || []).forEach(function(q){
      if(typeof q.percentUsed !== 'number' || isStale(q))
        out.push({ provider: p.name.replace(/<[^>]*>/g,''), quota: q });
    });
  });
  return out;
}

function renderStaleness(providers){
  var el = document.getElementById('staleness');
  if(!el) return;
  var bad = staleQuotas(providers);
  if(!bad.length){ el.style.display = 'none'; return; }
  var lines = bad.map(function(b){
    var why = typeof b.quota.percentUsed !== 'number'
      ? 'no reading'
      : 'last read ' + fmtAge(ageHours(b.quota.syncedAt)) + ' ago';
    return b.provider + ' · ' + b.quota.label + ' — ' + why;
  });
  el.style.display = 'block';
  el.innerHTML =
    '<strong>' + bad.length + ' quota window' + (bad.length === 1 ? '' : 's') +
    ' cannot be trusted right now.</strong><br>' + lines.join('<br>') +
    '<br><br>The automated sync only refreshes the token counts further down this page. ' +
    'Quota windows without an API are updated by hand from the consoles linked on each card.';
}

async function loadUsage(){
  try{
    const res = await fetch('ai-usage.json?_=' + Date.now());
    if(!res.ok) throw new Error('No data');
    const data = await res.json();

    const providers = data.providers || [];

    // Label this for what it is. lastUpdated reflects the token-count sync,
    // not the provider quotas, and conflating the two is what hid a
    // days-old 45% behind a fresh-looking timestamp.
    const updated = new Date(data.lastUpdated);
    document.getElementById('lastUpdated').textContent =
      'Token counts synced ' + updated.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) +
      ' · quota freshness shown per window below';
    renderStaleness(providers);

    // "Usable" is the honest headline: a reading, fresh, with headroom left.
    const usable = providers.filter(p => availabilityFor(p).state === 'open').length;
    const monthly = providers.reduce((s,p) => s + (p.monthlyCost || 0), 0);

    // A provider whose price nobody has written down must not be summed as $0.
    // Same failure mode as the stale quotas: an unknown quietly rendered as a
    // confident number. Mark the total as a floor instead.
    const unpriced = providers.filter(p => typeof p.monthlyCost !== 'number').length;

    // Cost line
    document.getElementById('bars-cost').innerHTML =
      '<span>Monthly: <strong>$' + monthly.toFixed(0) + (unpriced ? '+' : '') + '</strong>' +
      (unpriced ? '<span class="cost-caveat" title="' + unpriced + ' provider' + (unpriced === 1 ? '' : 's') +
        ' with no recorded price"> · ' + unpriced + ' unpriced</span>' : '') + '</span>' +
      '<span>Usable now: <strong>' + usable + '/' + providers.length + '</strong></span>';

    // Vertical bars
    document.getElementById('bars-container').innerHTML = providers.map((p,i) => {
      const pct = percentFor(p);
      const status = statusFor(p);
      const h = status === 'unknown' ? 100 : Math.min(pct, 100);
      const shortName = p.name.replace(/<[^>]*>/g,'').split(' ')[0].split('/')[0].trim();
      return '<a href="#provider-' + i + '" class="bar-col" data-idx="' + i + '">' +
        '<div class="bar-pct">' + (status === 'unknown' ? '?' : Math.round(pct) + '%') + '</div>' +
        '<div class="bar-track"><div class="bar-level ' + status + '" style="height:' + h + '%"></div></div>' +
        '<div class="bar-name">' + shortName + '</div>' +
        '</a>';
    }).join('');

    // Wire bar clicks — flying cursor animation
    document.querySelectorAll('.bar-col').forEach(function(bar){
      bar.addEventListener('click', function(e){
        e.preventDefault();
        var idx = this.getAttribute('data-idx');
        var target = document.getElementById('provider-' + idx);
        if(!target) return;
        // Remove existing flash
        document.querySelectorAll('.provider-detail.flash').forEach(function(el){ el.classList.remove('flash'); });
        // Start scrolling the page toward the card
        target.scrollIntoView({behavior:REDUCED ? 'auto' : 'smooth', block:'center'});
        // Launch the fake cursor from the click point, chasing the card as the page scrolls
        if (REDUCED) {
          target.classList.add('flash');
          setTimeout(function(){ target.classList.remove('flash'); }, 1500);
        }
        else flyCursor(e.clientX, e.clientY, target);
      });
    });

    // Detail cards
    document.getElementById('details-container').innerHTML = providers.map((p,i) => {
      const avail = availabilityFor(p);
      const models = (p.models || []).map(m => '<span class="pd-model' + (m.active ? ' active' : '') + '">' + m.name + '</span>').join('');

      // Every window gets its own row, so a spent weekly pool and an idle
      // session window are never averaged into one misleading number.
      const quotaRows = (p.quotas || []).map(function(q){
        const qs = statusForQuota(q);
        const known = typeof q.percentUsed === 'number';
        const w = known ? Math.min(q.percentUsed, 100) : 100;
        const reset = q.resetsAt ? 'resets in ' + fmtCountdown(q.resetsAt) : (q.resetNote || '');
        const readout = !known ? 'no reading'
          : qs === 'stale' ? Math.round(q.percentUsed) + '% — unverified'
          : Math.round(q.percentUsed) + '% used';
        const provenance = q.syncedAt
          ? (q.source === 'api' ? 'API' : 'by hand') + ' · ' + fmtAge(ageHours(q.syncedAt)) + ' ago'
          : 'never synced';
        return '<div class="pd-quota">' +
          '<div class="pd-quota-top">' +
            '<span class="pd-quota-label">' + q.label + '</span>' +
            '<span class="pct ' + qs + '">' + readout + '</span>' +
          '</div>' +
          '<div class="pd-bar-wrap"><div class="pd-bar-fill ' + qs + '" style="width:' + w + '%"></div></div>' +
          '<div class="pd-quota-reset">' + reset +
            (q.resetsAt && q.resetNote ? ' · ' + q.resetNote : '') +
            '<span class="pd-prov">' + provenance + '</span></div>' +
          '</div>';
      }).join('');

      return '<div class="provider-detail" id="provider-' + i + '">' +
        '<div class="pd-head"><div class="pd-name">' + p.name + '</div><div class="pd-tier">' + (p.tier || '—') + '</div></div>' +
        '<div class="pd-avail ' + avail.state + '">' + avail.text + '</div>' +
        quotaRows +
        '<div class="pd-info">' +
          (p.plan ? '<span><strong>Plan:</strong> ' + p.plan + '</span>' : '') +
          (p.cost ? '<span><strong>Cost:</strong> ' + p.cost + '</span>' : '') +
          (p.endpoint ? '<span><strong>API:</strong> ' + p.endpoint + '</span>' : '') +
        '</div>' +
        (models ? '<div class="pd-models">' + models + '</div>' : '') +
        (p.link ? '<a class="pd-link" href="' + p.link + '" target="_blank" rel="noopener">' + (p.linkLabel || 'View usage') + ' &nearr;</a>' : '') +
        // Deliberately NOT stamping data.lastUpdated here. That timestamp
        // describes the token-count sync only; printing it on a provider card
        // is what made an eight-day-old quota look freshly read. Per-window
        // provenance above tells the truth instead.
        '</div>';
    }).join('');

    // Cache raw data and render Tool Usage
    rawData = data;
    renderToolUsage(data, currentRange);

  }catch(e){
    document.getElementById('bars-container').innerHTML = '<div style="text-align:center;color:var(--dim);padding:var(--s-5)">Still warming up…</div>';
  }
}

// ── HELPERS ──
function parseTokenLabel(label){
  label=(label||'0').toUpperCase();
  try{
    if(label.endsWith('B')) return parseFloat(label.slice(0,-1))*1000;
    if(label.endsWith('M')) return parseFloat(label.slice(0,-1));
    if(label.endsWith('K')) return parseFloat(label.slice(0,-1))/1000;
    return parseFloat(label)/1e6;
  }catch(e){return 0}
}

function fmtTok(t){return t >= 1000 ? (t/1000).toFixed(t>=10000?0:1).replace(/\.0$/,'') + 'B' : Math.round(t) + 'M'}

var CATEGORIES = {'OpenClaw':'assistants','Hermes':'assistants','Codex CLI':'devtools','Claude Code':'devtools'};
var CATEGORY_LABELS = {'assistants':'AI Assistants','devtools':'Dev Tools'};
var CATEGORY_SUBS = {'assistants':'Always-on agents · Mac control · personal','devtools':'Coding · IDE · CLI'};
var MODEL_PROVIDER={'GLM-5.2':'Z.ai','GLM-4.7':'Z.ai','GLM-5':'Z.ai','GLM-4.6':'Z.ai','Kimi-K2.7-Code':'Synthetic','Kimi-K3 (Synthetic)':'Synthetic','Kimi-K3 (Moonshot)':'Moonshot','Gemini Flash':'Google','GPT-5.6-sol':'OpenAI','GPT-5.5':'OpenAI','GPT-5.4':'OpenAI','Fable-5':'Anthropic','Opus-5':'Anthropic','MiniMax-M3':'MiniMax','MiniMax-M2.7':'MiniMax','Llama-3.3-70B':'Groq'};

// ── TIME RANGE FILTERING ──
function filterDailyEntries(daily, range){
  if(!daily || !daily.length) return null;
  var now = new Date();
  var cutoff = new Date();
  if(range==='24h') cutoff.setDate(now.getDate()-1);
  else if(range==='7d') cutoff.setDate(now.getDate()-7);
  else cutoff.setDate(now.getDate()-30);
  var cutoffStr = cutoff.toISOString().slice(0,10);
  return daily.filter(function(e){return e.date >= cutoffStr});
}

function rebuildToolFromDaily(tool, filteredDaily){
  // If no daily data for this tool, return original
  if(!filteredDaily) return tool;
  var modelTotals = {};
  filteredDaily.forEach(function(e){
    if(!modelTotals[e.model]) modelTotals[e.model] = 0;
    modelTotals[e.model] += e.tokens;
  });
  var grand = 0;
 var models = Object.keys(modelTotals).map(function(name){
    var t = modelTotals[name];
    grand += t;
    return {name:name, tokens:t};
  }).sort(function(a,b){return b.tokens-a.tokens});
  if(grand===0) return null; // no data in this window
  var maxModel = models.length ? models[0].tokens : 1;
  models.forEach(function(m){
    m.tokensLabel = fmtTok(m.tokens);
    m.share = Math.round(m.tokens/maxModel*100);
  });
  return {
    name: tool.name,
    tokensRaw: grand,
    tokensLabel: fmtTok(grand),
    share: 0, // set later
    models: models
  };
}

function renderToolUsage(data, range){
  if(!data || !data.toolUsage) return;
  var tu = data.toolUsage;
  var rangeLabels = {'24h':'Last 24 hours','7d':'Last 7 days','30d':'Last 30 days'};

  // Try to rebuild each tool from daily data if available
  var tools = tu.tools.map(function(t){
    if(t.daily){
      var filtered = filterDailyEntries(t.daily, range);
      var rebuilt = rebuildToolFromDaily(t, filtered);
      return rebuilt || {name:t.name, tokensRaw:0, tokensLabel:'0M', share:0, models:[]};
    }
    // No daily data — use the pre-aggregated entry as-is (only for 30d)
    if(range!=='30d') return {name:t.name, tokensRaw:0, tokensLabel:'—', share:0, models:[]};
    return {
      name:t.name,
      tokensRaw: parseTokenLabel(t.tokensLabel),
      tokensLabel:t.tokensLabel,
      share:0,
      models:t.models
    };
  });

  // Recalculate shares
  var grandTotal = tools.reduce(function(s,t){return s+(t.tokensRaw||0)},0);
  tools.forEach(function(t){
    t.share = grandTotal>0 ? Math.round((t.tokensRaw/grandTotal)*100) : 0;
    // Also recalculate model shares relative to this tool's own total
    if(t.models && t.models.length){
      var mt = t.models.reduce(function(s,m){return s+(m.tokens||0)},0);
      if(mt>0){
        var maxShare = Math.max.apply(null, t.models.map(function(m){return m.share||0}));
        t.models.forEach(function(m){
          if(m.tokens) m.share = Math.round((m.tokens/mt)*100);
        });
      }
    }
  });

  // Sort tools by tokens descending
  tools.sort(function(a,b){return (b.tokensRaw||0)-(a.tokensRaw||0)});

  // Render
  function renderToolCard(t){
    if(!t.models || !t.models.length || t.tokensRaw===0){
      return '<div class="tu-tool" style="opacity:.4"><div class="tu-head"><div class="tu-name">' + t.name + '</div><div class="tu-tokens">—</div></div></div>';
    }
    var html = '<div class="tu-tool">' +
      '<div class="tu-head"><div class="tu-name">' + t.name + '</div>' +
      '<div class="tu-tokens">' + t.tokensLabel + '</div></div>' +
      '<div class="tu-bar"><div class="tu-fill" style="width:' + t.share + '%"></div></div>' +
      '<div class="tu-models">';
    var maxShare = Math.max.apply(null, t.models.map(function(m){return m.share||0}));
    t.models.forEach(function(m){
      var isTop = (m.share||0) === maxShare && t.models.length > 1;
      html += '<div class="tu-model">' +
        '<span class="m-name">' + m.name + '</span>' +
        '<span class="m-bar"><span class="m-fill' + (isTop ? ' top' : '') + '" style="display:block;width:' + (m.share||0) + '%"></span></span>' +
        '<span class="m-tokens">' + (m.tokensLabel||'—') + '</span>' +
        '</div>';
    });
    html += '</div></div>';
    return html;
  }

  var tuHtml = '<h2 class="details-title">Tool <em>Usage</em></h2>' +
    '<div class="tu-total">' + fmtTok(grandTotal) + ' <em>tokens</em></div>' +
    '<div class="tu-total-label">' + rangeLabels[range] + ' · local logs</div>';

  // Group by category
  ['assistants','devtools'].forEach(function(cat){
    var catTools = tools.filter(function(t){return CATEGORIES[t.name]===cat});
    if(!catTools.length) return;
    tuHtml += '<div class="tu-cat-label">' + CATEGORY_LABELS[cat] +
      '<span class="tu-cat-sub">' + CATEGORY_SUBS[cat] + '</span></div>';
    catTools.forEach(function(t){ tuHtml += renderToolCard(t); });
  });
  // Uncategorized
  tools.filter(function(t){return !CATEGORIES[t.name]}).forEach(function(t){ tuHtml += renderToolCard(t); });

  document.getElementById('tool-usage').innerHTML = tuHtml;

  // Render leaderboard into its own container (between bars and tool usage)
  renderLeaderboard(tools, range);

  // Highlights / Stat Cards — computed from dailyStats if available
  var allStats = [];
  tools.forEach(function(t){
    if(t.dailyStats){
      var filtered = filterDailyEntries(t.dailyStats, range);
      if(filtered) filtered.forEach(function(s){
        s._tool = t.name;
        allStats.push(s);
      });
    }
  });

  if(allStats.length){
    var champ = {
      maxOut: {val:0, model:'', tool:'', date:''},
      maxThink: {val:0, model:'', tool:'', date:''},
      maxTurn: {val:0, model:'', tool:'', date:''},
      busiestDay: {val:0, date:''},
      totalCalls: 0
    };
    // Per-day totals for busiest day
    var dayTotals = {};
    allStats.forEach(function(s){
      if(s.maxOut > champ.maxOut.val)
        champ.maxOut = {val:s.maxOut, model:s.maxOutModel, tool:s._tool, date:s.date};
      if(s.maxThink > champ.maxThink.val)
        champ.maxThink = {val:s.maxThink, model:s.maxThinkModel, tool:s._tool, date:s.date};
      if(s.maxTurn > champ.maxTurn.val)
        champ.maxTurn = {val:s.maxTurn, model:s.maxTurnModel, tool:s._tool, date:s.date};
      champ.totalCalls += s.calls || 0;
      // Sum tokens per day from daily buckets
    });
    // Use the daily token buckets for busiest day
    tools.forEach(function(t){
      if(t.daily){
        filterDailyEntries(t.daily, range).forEach(function(e){
          if(!dayTotals[e.date]) dayTotals[e.date] = 0;
          dayTotals[e.date] += e.tokens;
        });
      }
    });
    Object.keys(dayTotals).forEach(function(d){
      if(dayTotals[d] > champ.busiestDay.val)
        champ.busiestDay = {val:dayTotals[d], date:d};
    });

    function fmtDate(ds){
      if(!ds) return '';
      try{
        var dt = new Date(ds + 'T12:00:00');
        return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
      }catch(e){return ds}
    }

    tuHtml += '<h2 class="details-title" style="margin-top:var(--s-7)">Highlights <em>&amp; Champions</em></h2>' +
      '<div class="mc-sub">Single-turn extremes · ' + rangeLabels[range].toLowerCase() + ' · local logs</div>';
    tuHtml += '<div class="hl-grid">';

    if(champ.maxTurn.val > 0)
      tuHtml += '<div class="hl-card"><span class="hl-emoji">🏋️</span><span class="hl-label">Longest Turn</span>' +
        '<span class="hl-value">' + fmtTok(champ.maxTurn.val) + '</span>' +
        '<span class="hl-model">' + champ.maxTurn.model + '</span>' +
        '<span class="hl-date">' + fmtDate(champ.maxTurn.date) + '</span></div>';

    if(champ.maxThink.val > 0)
      tuHtml += '<div class="hl-card"><span class="hl-emoji">🧠</span><span class="hl-label">Deepest Think</span>' +
        '<span class="hl-value">' + fmtTok(champ.maxThink.val) + '</span>' +
        '<span class="hl-model">' + champ.maxThink.model + '</span>' +
        '<span class="hl-date">' + fmtDate(champ.maxThink.date) + '</span></div>';

    if(champ.maxOut.val > 0)
      tuHtml += '<div class="hl-card"><span class="hl-emoji">📣</span><span class="hl-label">Biggest Response</span>' +
        '<span class="hl-value">' + fmtTok(champ.maxOut.val) + '</span>' +
        '<span class="hl-model">' + champ.maxOut.model + '</span>' +
        '<span class="hl-date">' + fmtDate(champ.maxOut.date) + '</span></div>';

    if(champ.busiestDay.val > 0)
      tuHtml += '<div class="hl-card"><span class="hl-emoji">🔥</span><span class="hl-label">Busiest Day</span>' +
        '<span class="hl-value">' + fmtTok(champ.busiestDay.val) + '</span>' +
        '<span class="hl-model">tokens moved</span>' +
        '<span class="hl-date">' + fmtDate(champ.busiestDay.date) + '</span></div>';

    if(champ.totalCalls > 0)
      tuHtml += '<div class="hl-card"><span class="hl-emoji">📞</span><span class="hl-label">Total Calls</span>' +
        '<span class="hl-value">' + champ.totalCalls.toLocaleString() + '</span>' +
        '<span class="hl-model">API requests</span>' +
        '<span class="hl-date">' + rangeLabels[range] + '</span></div>';

    tuHtml += '</div>';
  }

  document.getElementById('tool-usage').innerHTML = tuHtml;
}

function renderLeaderboard(tools, range){
  var rangeLabels = {'24h':'Last 24 hours','7d':'Last 7 days','30d':'Last 30 days'};
  var modelTotals = {};
  tools.forEach(function(t){
    (t.models||[]).forEach(function(m){
      if(!modelTotals[m.name]) modelTotals[m.name] = 0;
      var tok = m.tokens;
      if(!tok && m.tokensLabel) tok = parseTokenLabel(m.tokensLabel) * (m.tokensLabel.indexOf('B')>-1 ? 1000 : 1);
      modelTotals[m.name] += (tok||0);
    });
  });
  var board = Object.keys(modelTotals).map(function(name){return {name:name,tokens:modelTotals[name]}})
    .filter(function(m){return m.tokens>0})
    .sort(function(a,b){return b.tokens-a.tokens});
  if(!board.length){document.getElementById('model-leaderboard').innerHTML=''; return}
  var maxTok = board[0].tokens;
  var lbHtml = '<h2 class="details-title">Models, <em>side by side</em></h2>' +
    '<div class="mc-sub">Total tokens across every tool · ' + rangeLabels[range].toLowerCase() + ' · local logs</div>';
  var podiumClasses=['first','second','third'];
  if(board.length>=3){
    lbHtml += '<div class="mc-podium">';
    for(var pi=0;pi<3;pi++){
      var pm=board[pi];
      lbHtml += '<div class="mc-podium-card ' + podiumClasses[pi] + '">' +
        '<span class="mc-podium-rank">' + String(pi+1).padStart(2,'0') + '</span>' +
        '<span class="mc-podium-name">' + pm.name + '</span>' +
        '<span class="mc-podium-provider">' + (MODEL_PROVIDER[pm.name]||'') + '</span>' +
        '<span class="mc-podium-tokens">' + fmtTok(pm.tokens) + '</span>' +
        '</div>';
    }
    lbHtml += '</div>';
  }
  board.forEach(function(m,i){
    if(board.length>=3 && i<3) return;
    lbHtml += '<div class="mc-row">' +
      '<div class="mc-head"><span class="mc-rank">' + String(i+1).padStart(2,'0') + '</span>' +
      '<span class="mc-name">' + m.name + '</span>' +
      '<span class="mc-provider">' + (MODEL_PROVIDER[m.name]||'') + '</span>' +
      '<span class="mc-tokens">' + fmtTok(m.tokens) + '</span></div>' +
      '<div class="mc-bar"><span class="mc-fill" style="display:block;width:' + Math.round(m.tokens/maxTok*100) + '%"></span></div>' +
      '</div>';
  });
  document.getElementById('model-leaderboard').innerHTML = lbHtml;
}

// ── Flying cursor ──
// A fake mouse cursor appears where you clicked, glides with slight
// human wobble down to the target card, then "clicks" it: ripple
// burst + outline pulse, then fades out.
var flying = false;
function flyCursor(startX, startY, target){
  if(REDUCED) return;
  if(flying) return;
  flying = true;

  var cursor = document.getElementById('lab-cursor');
  if(!cursor){
    cursor = document.createElement('div');
    cursor.id = 'lab-cursor';
    cursor.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="#F4F1EC" stroke="#0B0B0C" stroke-width="1.5"><path d="M5 3l14 9-6.5 1.4L9 21z"/></svg><div class="ripple"></div>';
    document.body.appendChild(cursor);
  }

  var x = startX, y = startY;
  cursor.style.opacity = '1';
  cursor.style.transform = 'translate(' + x + 'px,' + y + 'px)';

  var t = 0;
  function step(){
    var r = target.getBoundingClientRect();
    // Aim slightly above card center so the cursor tip lands on it
    var tx = r.left + r.width * 0.5;
    var ty = r.top + Math.min(70, r.height * 0.35);

    // Ease toward target with a gentle sine wobble (human-ish hand motion)
    t += 0.045;
    x += (tx - x) * 0.055;
    y += (ty - y) * 0.055;
    var wobble = Math.sin(t * 3) * 3 * Math.max(0, 1 - t);

    cursor.style.transform = 'translate(' + (x + wobble) + 'px,' + y + 'px)';

    var dx = tx - x, dy = ty - y;
    if(Math.sqrt(dx*dx + dy*dy) < 8){
      // Arrived — click!
      cursor.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(.85)';
      var ripple = cursor.querySelector('.ripple');
      ripple.classList.remove('go');
      void ripple.offsetWidth; // restart animation
      ripple.classList.add('go');

      target.classList.add('flash');

      setTimeout(function(){
        cursor.style.transform += ' scale(1)';
        cursor.style.opacity = '0';
        setTimeout(function(){ target.classList.remove('flash'); flying = false; }, 1500);
      }, 300);
      return;
    }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

loadUsage();
setInterval(loadUsage, 15 * 60 * 1000);

function manualRefresh(){
  var btn = document.getElementById('refreshBtn');
  if(btn){btn.style.opacity='.5';btn.textContent='⟳ Refreshing…'}
  loadUsage().then(function(){
    if(btn){btn.style.opacity='1';btn.textContent='✓ Refreshed';setTimeout(function(){btn.textContent='↻ Refresh'},2000)}
  }).catch(function(){
    if(btn){btn.style.opacity='1';btn.textContent='↻ Refresh'}
  });
}
