<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem("lab-theme");if(t&&t!=="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Usage & What's New | LaB Media</title>
<meta name="robots" content="noindex,nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lab.css">

<style>
.usage-wrap{
  max-width:1200px;margin:0 auto;padding:clamp(32px,5vw,64px) var(--gutter) var(--s-9);
}
.usage-head{text-align:center;margin-bottom:var(--s-7)}
.usage-head h1{
  font-family:var(--f-display);font-weight:400;
  font-size:clamp(32px,5vw,56px);line-height:1.04;letter-spacing:-.028em;margin:0 0 var(--s-2);
}
.usage-head h1 em{font-style:italic;color:var(--accent)}
.usage-head p{color:var(--dim);font-size:var(--t-base);line-height:1.6;max-width:48ch;margin:0 auto}
.usage-head .updated{
  font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);margin-top:var(--s-3);
}
.refresh-btn{
  font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent-dim);
  padding:5px 14px;border-radius:var(--radius);cursor:pointer;margin-top:var(--s-3);
  transition:opacity .3s;
}

/* Two column layout */
.columns{
  display:grid;grid-template-columns:1fr 1fr;gap:var(--s-7);
}
@media(max-width:768px){.columns{grid-template-columns:1fr}}

/* Left: Usage */
.col-usage h2,.col-news h2{
  font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3vw,32px);
  line-height:1.1;margin:0 0 var(--s-5);letter-spacing:-.02em;
}
.col-usage h2 em,.col-news h2 em{font-style:italic;color:var(--accent)}

.summary{
  display:grid;grid-template-columns:repeat(2,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line);
  border-radius:6px;overflow:hidden;margin-bottom:var(--s-5);
}
.summary div{
  background:var(--paper-2);padding:var(--s-3) var(--s-3);
  display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center;
}
.summary dt{
  font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);order:2;
}
.summary dd{
  font-family:var(--f-display);font-size:clamp(20px,2.5vw,28px);
  color:var(--ink);line-height:1;order:1;margin:0;
}
.summary dd em{font-style:italic;color:var(--accent)}

.provider{
  background:var(--paper-2);border:1px solid var(--line);
  padding:var(--s-3) var(--s-4);margin-bottom:var(--s-2);border-radius:6px;
  transition:border-color var(--mid) var(--ease);
}
.provider:hover{border-color:var(--line-2)}
.provider-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s-2)}
.provider-name{font-family:var(--f-display);font-size:var(--t-lg);font-weight:400;color:var(--ink);line-height:1.1}
.provider-name em{font-style:italic;color:var(--accent)}
.provider-tier{
  font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding:2px 8px;border:1px solid var(--line);border-radius:var(--radius);
}
.bar-wrap{position:relative;height:5px;background:var(--paper-3);border-radius:var(--radius);overflow:hidden;margin-bottom:var(--s-2)}
.bar-fill{height:100%;border-radius:var(--radius);transition:width var(--slow) var(--ease);position:relative}
.bar-fill::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(244,241,236,.12),transparent);
  animation:shimmer 3s infinite;
}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@media(prefers-reduced-motion:reduce){.bar-fill::after{animation:none}}
.bar-labels{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-mono);font-size:9px;letter-spacing:.06em}
.bar-labels .used{color:var(--dim)}
.bar-labels .pct{color:var(--ink);font-weight:700}
.bar-labels .reset{color:var(--faint);font-size:9px}
.status-ok .bar-fill{background:var(--good)}
.status-warn .bar-fill{background:var(--accent)}
.status-crit .bar-fill{background:#E0533A}
.status-unknown .bar-fill{background:var(--faint);width:100%;opacity:.25}
.status-unknown .bar-fill::after{animation:none}
.status-ok .pct{color:var(--good)}
.status-warn .pct{color:var(--accent)}
.status-crit .pct{color:#E0533A}
.model-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:var(--s-2)}
.model-tag{
  font-family:var(--f-mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 6px;border:1px solid var(--line);color:var(--faint);border-radius:var(--radius);
}
.model-tag.active{color:var(--accent);border-color:var(--accent-dim);background:var(--accent-bg)}

/* Right: What's New */
.news-feed{}
.news-day{margin-bottom:var(--s-5)}
.news-day-header{
  font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);margin-bottom:var(--s-3);
  padding-bottom:6px;border-bottom:1px solid var(--line);
}
.news-item{
  padding:var(--s-2) 0;border-bottom:1px solid var(--line);
  color:var(--dim);font-size:var(--t-sm);line-height:1.6;
}
.news-item:last-child{border-bottom:0}
.news-item strong{color:var(--ink);font-weight:400}
.news-item:hover .news-time{opacity:1}
.news-time{
  font-family:var(--f-mono);font-size:9px;letter-spacing:.08em;
  color:var(--faint);opacity:0;transition:opacity .2s;margin-right:8px;
}
.news-more{
  text-align:center;padding:var(--s-4);font-family:var(--f-mono);font-size:var(--t-xs);
  letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  border:1px solid var(--line);border-radius:6px;cursor:pointer;transition:color .3s,border-color .3s;
}
.news-more:hover{color:var(--accent);border-color:var(--accent-dim)}

.note-box{
  background:var(--accent-bg);border:1px solid var(--accent-dim);
  padding:var(--s-3) var(--s-4);margin-bottom:var(--s-5);border-radius:6px;
}
.note-box p{color:var(--dim);font-size:var(--t-xs);line-height:1.6;margin:0}

.egg{text-align:center;padding:var(--s-6) 0;font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.egg a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>

<div class="usage-wrap">

  <div class="usage-head">
    <h1>AI Usage <em>Dashboard</em></h1>
    <p>Provider quotas and site updates in one place.</p>
    <div class="updated" id="lastUpdated">Loading…</div>
    <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">↻ Refresh</button>
  </div>

  <div class="columns">
    <!-- LEFT: Usage Stats -->
    <div class="col-usage">
      <h2>Provider <em>Usage</em></h2>
      <div class="summary" id="summary">
        <div><dd id="sum-monthly">—</dd><dt>Monthly Cost</dt></div>
        <div><dd id="sum-health">—</dd><dt>Active</dt></div>
      </div>
      <div id="providers"></div>
      <div class="note-box">
        <p>Live APIs poll where possible. Others updated by Wheatley on a schedule. Data may be delayed up to 15 min.</p>
      </div>
    </div>

    <!-- RIGHT: What's New -->
    <div class="col-news">
      <h2>What's <em>New</em></h2>
      <div class="news-feed" id="news-feed"></div>
      <div class="news-more" id="news-more" onclick="loadMoreNews()" style="display:none">Load previous days</div>
    </div>
  </div>

  <div class="egg">🔒 You found the <a href="/">control room</a></div>

</div>

<script>
var allNews = [];
var visibleDays = 3;

async function loadUsage(){
  try{
    const res = await fetch('ai-usage.json?_=' + Date.now());
    if(!res.ok) throw new Error('No data');
    const data = await res.json();

    const updated = new Date(data.lastUpdated);
    document.getElementById('lastUpdated').textContent =
      'Updated ' + updated.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});

    const providers = data.providers || [];
    const active = providers.filter(p => p.status !== 'unknown').length;
    const monthly = providers.reduce((s,p) => s + (p.monthlyCost || 0), 0);
    document.getElementById('sum-monthly').innerHTML = '$' + monthly.toFixed(0);
    document.getElementById('sum-health').innerHTML = active + '<em>/</em>' + providers.length;

    const container = document.getElementById('providers');
    container.innerHTML = providers.map(p => {
      const pct = p.percentUsed;
      const status = p.status || (pct < 50 ? 'ok' : pct < 80 ? 'warn' : pct < 100 ? 'crit' : 'unknown');
      const barWidth = status === 'unknown' ? 100 : Math.min(pct, 100);
      const models = (p.models || []).map(m => `<span class="model-tag${m.active ? ' active' : ''}">${m.name}</span>`).join('');
      return `
        <div class="provider">
          <div class="provider-head">
            <div class="provider-name">${p.name}</div>
            <div class="provider-tier">${p.tier || '—'}</div>
          </div>
          <div class="bar-wrap status-${status}"><div class="bar-fill" style="width:${barWidth}%"></div></div>
          <div class="bar-labels">
            <span class="used">${p.usedLabel || '—'}</span>
            <span class="pct">${status === 'unknown' ? '?' : Math.round(pct) + '%'}</span>
            <span class="reset">${p.resetsIn || ''}</span>
          </div>
          ${models ? `<div class="model-tags">${models}</div>` : ''}
        </div>`;
    }).join('');

    // Load What's New
    try{
      const clRes = await fetch('changelog.json?_=' + Date.now());
      if(clRes.ok){
        const cl = await clRes.json();
        allNews = groupByDay(cl.entries || []);
        renderNews();
      }
    }catch(e){}

  }catch(e){
    document.getElementById('providers').innerHTML = '<div class="note-box"><p>Still warming up. Data not available yet.</p></div>';
  }
}

function groupByDay(entries){
  var days = {};
  entries.forEach(function(e){
    var d = e.date;
    if(!days[d]) days[d] = [];
    days[d].push(e);
  });
  return Object.keys(days).sort(function(a,b){return b.localeCompare(a)}).map(function(k){
    return {date:k, items:days[k]};
  });
}

function renderNews(){
  var feed = document.getElementById('news-feed');
  var html = '';
  for(var i = 0; i < Math.min(visibleDays, allNews.length); i++){
    var day = allNews[i];
    var d = new Date(day.date + 'T12:00:00');
    var label = d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
    html += '<div class="news-day">';
    html += '<div class="news-day-header">' + label + '</div>';
    // Deduplicate similar entries — only keep the most notable per topic
    var seen = {};
    day.items.forEach(function(item){
      var key = item.text.replace(/<[^>]*>/g,'').substring(0, 40);
      if(seen[key]) return;
      seen[key] = true;
      html += '<div class="news-item" title="' + (item.time || '') + '">';
      html += '<span class="news-time">' + (item.time || '') + '</span>';
      html += item.text;
      html += '</div>';
    });
    html += '</div>';
  }
  feed.innerHTML = html;
  if(allNews.length > visibleDays){
    document.getElementById('news-more').style.display = 'block';
  }
}

function loadMoreNews(){
  visibleDays += 3;
  renderNews();
  if(allNews.length <= visibleDays){
    document.getElementById('news-more').style.display = 'none';
  }
}

loadUsage();
setInterval(loadUsage, 15 * 60 * 1000);

function manualRefresh(){
  var btn = document.getElementById('refreshBtn');
  if(btn){btn.style.opacity='.5';btn.textContent='⟳ Refreshing…'}
  loadUsage().then(function(){
    if(btn){btn.style.opacity='1';btn.textContent='✓ Refreshed';setTimeout(function(){btn.textContent='↻ Refresh'},2000)}
  }).catch(function(){
    if(btn){btn.style.opacity='1';btn.textContent='↻ Refresh'}
  });
}
</script>
</body>
</html>
