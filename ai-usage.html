<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){var K="lab-theme-v2",O="lab-theme",M={stone:"sepia",sepia:"timber"};try{var t=localStorage.getItem(K);if(t===null){var l=localStorage.getItem(O);if(l){t=M[l]||l;localStorage.setItem(K,t);}}if(t&&t!=="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Usage Dashboard | LaB Media</title>
<meta name="robots" content="noindex,nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lab.css">

<style>
/* ═══════════════════════════════════════════
   AI USAGE DASHBOARD — FINAL DESIGN
   Top: Vertical bars (Mockup A) — click to jump
   Middle: What's New timeline (Mockup B)
   Bottom: Expanded provider details (anchored)
   ═══════════════════════════════════════════ */

.wrap{max-width:820px;margin:0 auto;padding:clamp(32px,5vw,64px) var(--gutter) var(--s-10)}

/* ── BACK TO HOME ── */
.top-bar{margin-bottom:var(--s-5)}
.top-bar a{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);text-decoration:none;transition:color var(--fast) var(--ease);
}
.top-bar a:hover{color:var(--accent)}

/* ── HEADER ── */
.head{text-align:center;margin-bottom:var(--s-7)}
.head h1{
  font-family:var(--f-display);font-weight:400;
  font-size:clamp(32px,5vw,56px);line-height:1.02;letter-spacing:-.03em;margin:0 0 var(--s-2);
}
.head h1 em{font-style:italic;color:var(--accent)}
.head .sub{color:var(--dim);font-size:var(--t-base);line-height:1.6}
.head .meta{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin-top:var(--s-3);
}
.refresh-btn{
  font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent-dim);
  padding:4px 14px;border-radius:var(--radius);cursor:pointer;margin-top:var(--s-3);
  transition:opacity .3s;
}

/* ── VERTICAL BARS (top section) ── */
.bars-section{
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:var(--s-6) var(--s-4) var(--s-5);margin-bottom:var(--s-7);
}
.bars{
  display:flex;gap:var(--s-4);justify-content:center;align-items:flex-end;
  height:130px;
}
.bar-col{
  display:flex;flex-direction:column;align-items:center;gap:var(--s-2);
  flex:1;max-width:72px;height:100%;justify-content:flex-end;cursor:pointer;
  text-decoration:none;
}
.bar-col:hover .bar-track{border-color:var(--line-2)}
.bar-col:hover .bar-name{color:var(--ink)}

.bar-pct{
  font-family:var(--f-mono);font-size:9px;font-weight:700;
  color:var(--ink);letter-spacing:.04em;
}
.bar-track{
  width:100%;max-width:34px;height:100%;background:var(--paper-3);
  border-radius:2px;position:relative;overflow:hidden;
  border:1px solid var(--line);transition:border-color .3s;
}
.bar-level{
  position:absolute;bottom:0;left:0;right:0;border-radius:1px;
  transition:height var(--slow) var(--ease);
}
.bar-level.ok{background:var(--good)}
.bar-level.warn{background:var(--accent)}
.bar-level.crit{background:#E0533A}
.bar-level.unknown{background:var(--faint);opacity:.18}

.bar-name{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink);text-align:center;line-height:1.3;
  transition:color .3s;
}

.bars-cost{
  display:flex;justify-content:center;gap:var(--s-6);margin-top:var(--s-5);
  font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);
}
.bars-cost strong{color:var(--accent);font-weight:400}

/* ── WHAT'S NEW (timeline) ── */
.news-title{
  font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3vw,32px);
  text-align:center;margin-bottom:var(--s-5);letter-spacing:-.02em;
}
.news-title em{font-style:italic;color:var(--accent)}

.timeline{position:relative;padding-left:24px;margin-bottom:var(--s-6)}
.timeline::before{
  content:'';position:absolute;left:5px;top:6px;bottom:6px;
  width:1px;background:var(--line);
}

.tl-day{position:relative;margin-bottom:var(--s-5)}
.tl-day::before{
  content:'';position:absolute;left:-23px;top:0;
  width:11px;height:11px;border-radius:50%;background:var(--accent);
  border:2px solid var(--paper);z-index:1;
}
.tl-day-head{
  font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);margin-bottom:var(--s-3);
}
.tl-item{
  position:relative;padding:4px 0;color:var(--dim);
  font-size:var(--t-sm);line-height:1.55;
}
.tl-item::before{
  content:'';position:absolute;left:-19px;top:11px;
  width:5px;height:5px;border-radius:50%;background:var(--line-2);
}
.tl-item strong{color:var(--ink);font-weight:400}
.tl-item:hover .tl-time{opacity:1}
.tl-time{
  font-family:var(--f-mono);font-size:8.5px;letter-spacing:.06em;
  color:var(--faint);opacity:0;transition:opacity .2s;margin-right:6px;
}

.tl-more{
  text-align:center;padding:var(--s-3);font-family:var(--f-mono);font-size:var(--t-xs);
  letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  border:1px solid var(--line);border-radius:6px;cursor:pointer;
  transition:color .3s,border-color .3s;
}
.tl-more:hover{color:var(--accent);border-color:var(--accent-dim)}

/* ── PROVIDER DETAILS (anchor targets) ── */
.details-title{
  font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3vw,32px);
  text-align:center;margin:var(--s-8) 0 var(--s-5);letter-spacing:-.02em;
  padding-top:var(--s-5);border-top:1px solid var(--line);
}
.details-title em{font-style:italic;color:var(--accent)}

.provider-detail{
  padding:var(--s-5) var(--s-4);margin-bottom:var(--s-3);
  background:var(--paper-2);border:1px solid var(--line);border-radius:6px;
  scroll-margin-top:var(--s-5);
}
.provider-detail:hover{border-color:var(--line-2)}
.pd-link{display:inline-block;margin-top:var(--s-3);font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-decoration:none;transition:color var(--fast) var(--ease)}
.pd-link:hover{color:var(--accent)}

.pd-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:var(--s-3)}
.pd-name{font-family:var(--f-display);font-size:var(--t-xl);font-weight:400;color:var(--ink);line-height:1.1}
.pd-name em{font-style:italic;color:var(--accent)}
.pd-tier{
  font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding:2px 8px;border:1px solid var(--line);border-radius:var(--radius);
}

.pd-bar-wrap{position:relative;height:6px;background:var(--paper-3);border-radius:var(--radius);overflow:hidden;margin-bottom:var(--s-2)}
.pd-bar-fill{height:100%;border-radius:var(--radius);transition:width var(--slow) var(--ease)}
.pd-bar-fill.ok{background:var(--good)}
.pd-bar-fill.warn{background:var(--accent)}
.pd-bar-fill.crit{background:#E0533A}
.pd-bar-fill.unknown{background:var(--faint);opacity:.2;width:100%}

.pd-labels{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:9px;letter-spacing:.06em}
.pd-labels .used{color:var(--dim)}
.pd-labels .pct.ok{color:var(--good)}
.pd-labels .pct.warn{color:var(--accent)}
.pd-labels .pct.crit{color:#E0533A}
.pd-labels .pct.unknown{color:var(--faint)}
.pd-labels .reset{color:var(--faint);font-size:8.5px}

.pd-info{
  display:flex;flex-wrap:wrap;gap:var(--s-4);margin-top:var(--s-3);
  font-family:var(--f-mono);font-size:8.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--faint);
}
.pd-info span strong{color:var(--dim);font-weight:400}

.pd-models{display:flex;flex-wrap:wrap;gap:5px;margin-top:var(--s-3)}
.pd-model{
  font-family:var(--f-mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 7px;border:1px solid var(--line);color:var(--faint);border-radius:var(--radius);
}
.pd-model.active{color:var(--accent);border-color:var(--accent-dim);background:var(--accent-bg)}

/* ── TOOL USAGE ── */
.tu-total{
  text-align:center;font-family:var(--f-display);
  font-size:clamp(26px,3.4vw,38px);color:var(--ink);
  margin-bottom:var(--s-1);
}
.tu-total em{font-style:italic;color:var(--accent)}
.tu-total-label{
  text-align:center;font-family:var(--f-mono);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  margin-bottom:var(--s-5);
}
.tu-tool{
  padding:var(--s-4) var(--s-4);margin-bottom:var(--s-3);
  background:var(--paper-2);border:1px solid var(--line);border-radius:6px;
}
.tu-head{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:var(--s-2);
}
.tu-name{font-family:var(--f-display);font-size:var(--t-lg);color:var(--ink);font-weight:400}
.tu-tokens{font-family:var(--f-mono);font-size:var(--t-sm);font-weight:700;color:var(--accent)}
.tu-bar{
  height:5px;background:var(--paper-3);border-radius:var(--radius);
  overflow:hidden;margin-bottom:var(--s-3);
}
.tu-fill{height:100%;background:var(--accent);border-radius:var(--radius)}
.tu-models{display:flex;flex-direction:column;gap:5px}
.tu-model{
  display:grid;grid-template-columns:130px 1fr 60px;gap:var(--s-3);
  align-items:center;font-family:var(--f-mono);font-size:9px;
  letter-spacing:.06em;color:var(--dim);
}
.tu-model .m-name{color:var(--ink)}
.tu-model .m-bar{height:3px;background:var(--paper-3);border-radius:2px;overflow:hidden}
.tu-model .m-fill{height:100%;background:var(--dim);border-radius:2px}

/* ── MODEL LEADERBOARD (cross-tool) ── */
.mc-sub{color:var(--faint);font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;margin:calc(-1 * var(--s-3)) 0 var(--s-4)}
.mc-row{margin-bottom:var(--s-3)}
.mc-rank{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;color:var(--faint);width:2ch;flex:none}
.mc-row.top .mc-rank{color:var(--accent)}
.mc-head{display:flex;align-items:baseline;gap:var(--s-3);margin-bottom:4px}
.mc-name{font-size:var(--t-sm);color:var(--ink)}
.mc-provider{font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.mc-tokens{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--dim)}
.mc-bar{height:6px;background:var(--paper-3);border-radius:var(--radius);overflow:hidden}
.mc-fill{height:100%;background:var(--dim);border-radius:var(--radius)}
.mc-row.top .mc-fill{background:var(--accent)}
.mc-row.top .mc-tokens{color:var(--accent)}

/* ── PODIUM (top three models) ── */
.mc-podium{display:flex;gap:var(--s-3);align-items:flex-end;margin:var(--s-5) 0 var(--s-6)}
.mc-podium-card{flex:1;background:var(--paper-2);border:1px solid var(--line);border-radius:8px;
  padding:var(--s-4) var(--s-3);text-align:center;display:flex;flex-direction:column;gap:3px}
.mc-podium-card.first{order:2;padding-top:var(--s-6);padding-bottom:var(--s-6);border-color:var(--accent-dim);background:color-mix(in srgb,var(--accent) 6%,var(--paper-2))}
.mc-podium-card.second{order:1}
.mc-podium-card.third{order:3}
.mc-podium-rank{font-family:var(--f-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.mc-podium-card.first .mc-podium-rank{color:var(--accent)}
.mc-podium-name{font-family:var(--f-display);font-size:clamp(15px,2vw,20px);color:var(--ink);line-height:1.15}
.mc-podium-provider{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.mc-podium-tokens{font-family:var(--f-mono);font-size:clamp(16px,2.2vw,22px);color:var(--dim);margin-top:2px}
.mc-podium-card.first .mc-podium-tokens{color:var(--accent)}
@media (max-width:560px){
  .mc-podium{gap:var(--s-2)}
  .mc-podium-card{padding:var(--s-3) var(--s-2)}
  .mc-podium-card.first{padding-top:var(--s-4);padding-bottom:var(--s-4)}
}
.tu-model .m-fill.top{background:var(--good)}
.tu-model .m-tokens{text-align:right;color:var(--faint)}
@media(max-width:560px){
  .tu-model{grid-template-columns:100px 1fr 50px}
}

/* ── EGG ── */
.egg{text-align:center;padding:var(--s-7) 0;font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.egg a{color:var(--accent);text-decoration:none}

.note-box{
  background:var(--accent-bg);border:1px solid var(--accent-dim);
  padding:var(--s-3) var(--s-4);margin-bottom:var(--s-7);border-radius:6px;
}
.note-box p{color:var(--dim);font-size:var(--t-xs);line-height:1.6;margin:0}

/* Scroll behavior */
html{scroll-behavior:smooth}

/* Highlight pulse when jumped to */
@keyframes highlight-pulse{
  0%{box-shadow:0 0 0 0 var(--accent-dim);border-color:var(--accent)}
  30%{box-shadow:0 0 0 4px var(--accent-dim);border-color:var(--accent)}
  100%{box-shadow:0 0 0 0 transparent;border-color:var(--line)}
}
.provider-detail.flash{
  animation:highlight-pulse 1.4s var(--ease);
}

/* ── FLYING CURSOR ── */
#lab-cursor{
  position:fixed;top:0;left:0;z-index:10000;pointer-events:none;
  opacity:0;transition:opacity .3s;will-change:transform;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));
}
#lab-cursor svg{display:block}
#lab-cursor .ripple{
  position:absolute;left:9px;top:9px;width:8px;height:8px;
  border-radius:50%;border:2px solid var(--accent);
  transform:translate(-50%,-50%) scale(0);opacity:0;
}
@keyframes ripple-out{
  0%{transform:translate(-50%,-50%) scale(.3);opacity:.9}
  100%{transform:translate(-50%,-50%) scale(5);opacity:0}
}
#lab-cursor .ripple.go{animation:ripple-out .6s ease-out forwards}

@media(prefers-reduced-motion:reduce){
  .provider-detail.flash{animation:none;border-color:var(--accent)}
  #lab-cursor{display:none!important}
}
</style>
</head>
<body>

<div class="wrap">

  <div class="top-bar"><a href="index.html">&larr; LaB Media</a></div>

  <!-- ═══ HEADER ═══ -->
  <div class="head">
    <h1>AI Usage <em>Dashboard</em></h1>
    <div class="sub">Provider quotas and site updates.</div>
    <div class="meta" id="lastUpdated">Loading…</div>
    <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">↻ Refresh</button>
  </div>

  <!-- ═══ VERTICAL BARS ═══ -->
  <div class="bars-section">
    <div class="bars" id="bars-container"></div>
    <div class="bars-cost" id="bars-cost"></div>
  </div>

  <!-- ═══ WHAT'S NEW ═══ -->
  <h2 class="news-title">What's <em>New</em></h2>
  <div class="timeline" id="timeline"></div>
  <div class="tl-more" id="news-more" onclick="loadMoreNews()" style="display:none">Load previous days</div>

  <!-- ═══ PROVIDER DETAILS ═══ -->
  <h2 class="details-title">Provider <em>Details</em></h2>
  <div id="details-container"></div>

  <!-- ═══ TOOL USAGE ═══ -->
  <div id="tool-usage"></div>

  <div class="egg">🔒 <a href="/">labmedia.work</a></div>
</div>

<script>
var allNews = [];
var visibleDays = 3;
var REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches);

async function loadUsage(){
  try{
    const res = await fetch('ai-usage.json?_=' + Date.now());
    if(!res.ok) throw new Error('No data');
    const data = await res.json();

    const updated = new Date(data.lastUpdated);
    document.getElementById('lastUpdated').textContent =
      'Updated ' + updated.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});

    const providers = data.providers || [];
    const active = providers.filter(p => p.status !== 'unknown').length;
    const monthly = providers.reduce((s,p) => s + (p.monthlyCost || 0), 0);

    // Cost line
    document.getElementById('bars-cost').innerHTML =
      '<span>Monthly: <strong>$' + monthly.toFixed(0) + '</strong></span>' +
      '<span>Active: <strong>' + active + '/' + providers.length + '</strong></span>';

    // Vertical bars
    document.getElementById('bars-container').innerHTML = providers.map((p,i) => {
      const pct = p.percentUsed;
      const status = p.status || (pct < 50 ? 'ok' : pct < 80 ? 'warn' : pct < 100 ? 'crit' : 'unknown');
      const h = status === 'unknown' ? 100 : Math.min(pct, 100);
      const shortName = p.name.replace(/<[^>]*>/g,'').split(' ')[0].split('/')[0].trim();
      return '<a href="#provider-' + i + '" class="bar-col" data-idx="' + i + '">' +
        '<div class="bar-pct">' + (status === 'unknown' ? '?' : Math.round(pct) + '%') + '</div>' +
        '<div class="bar-track"><div class="bar-level ' + status + '" style="height:' + h + '%"></div></div>' +
        '<div class="bar-name">' + shortName + '</div>' +
        '</a>';
    }).join('');

    // Wire bar clicks — flying cursor animation
    document.querySelectorAll('.bar-col').forEach(function(bar){
      bar.addEventListener('click', function(e){
        e.preventDefault();
        var idx = this.getAttribute('data-idx');
        var target = document.getElementById('provider-' + idx);
        if(!target) return;
        // Remove existing flash
        document.querySelectorAll('.provider-detail.flash').forEach(function(el){ el.classList.remove('flash'); });
        // Start scrolling the page toward the card
        target.scrollIntoView({behavior:REDUCED ? 'auto' : 'smooth', block:'center'});
        // Launch the fake cursor from the click point, chasing the card as the page scrolls
        if (REDUCED) {
          target.classList.add('flash');
          setTimeout(function(){ target.classList.remove('flash'); }, 1500);
        }
        else flyCursor(e.clientX, e.clientY, target);
      });
    });

    // Detail cards
    document.getElementById('details-container').innerHTML = providers.map((p,i) => {
      const pct = p.percentUsed;
      const status = p.status || (pct < 50 ? 'ok' : pct < 80 ? 'warn' : pct < 100 ? 'crit' : 'unknown');
      const w = status === 'unknown' ? 100 : Math.min(pct, 100);
      const models = (p.models || []).map(m => '<span class="pd-model' + (m.active ? ' active' : '') + '">' + m.name + '</span>').join('');
      return '<div class="provider-detail" id="provider-' + i + '">' +
        '<div class="pd-head"><div class="pd-name">' + p.name + '</div><div class="pd-tier">' + (p.tier || '—') + '</div></div>' +
        '<div class="pd-bar-wrap"><div class="pd-bar-fill ' + status + '" style="width:' + w + '%"></div></div>' +
        '<div class="pd-labels"><span class="used">' + (p.usedLabel || '—') + '</span>' +
        '<span class="pct ' + status + '">' + (status === 'unknown' ? '?' : Math.round(pct) + '%') + '</span>' +
        '<span class="reset">' + (p.resetsIn || '') + '</span></div>' +
        '<div class="pd-info">' +
          (p.plan ? '<span><strong>Plan:</strong> ' + p.plan + '</span>' : '') +
          (p.cost ? '<span><strong>Cost:</strong> ' + p.cost + '</span>' : '') +
          (p.endpoint ? '<span><strong>API:</strong> ' + p.endpoint + '</span>' : '') +
        '</div>' +
        (models ? '<div class="pd-models">' + models + '</div>' : '') +
        (p.link ? '<a class="pd-link" href="' + p.link + '" target="_blank" rel="noopener">' + (p.linkLabel || 'View usage') + ' &nearr;</a>' : '') +
        '</div>';
    }).join('');

    // Tool Usage section
    if(data.toolUsage){
      var tu = data.toolUsage;
      var tuHtml = '<h2 class="details-title">Tool <em>Usage</em></h2>' +
        '<div class="tu-total">' + tu.totalLabel + ' <em>tokens</em></div>' +
        '<div class="tu-total-label">' + tu.period + ' · local logs</div>';
      tu.tools.forEach(function(t){
        tuHtml += '<div class="tu-tool">' +
          '<div class="tu-head"><div class="tu-name">' + t.name + '</div>' +
          '<div class="tu-tokens">' + t.tokensLabel + '</div></div>' +
          '<div class="tu-bar"><div class="tu-fill" style="width:' + t.share + '%"></div></div>' +
          '<div class="tu-models">';
        var maxShare = Math.max.apply(null, t.models.map(function(m){return m.share}));
        t.models.forEach(function(m){
          var isTop = m.share === maxShare && t.models.length > 1;
          tuHtml += '<div class="tu-model">' +
            '<span class="m-name">' + m.name + '</span>' +
            '<span class="m-bar"><span class="m-fill' + (isTop ? ' top' : '') + '" style="display:block;width:' + m.share + '%"></span></span>' +
            '<span class="m-tokens">' + m.tokensLabel + '</span>' +
            '</div>';
        });
        tuHtml += '</div></div>';
      });
      // Models, side by side : aggregate every model across tools into one
      // leaderboard, so a model's total is not split by which tool burned it.
      var MODEL_PROVIDER={'GLM-5.2':'Z.ai','GLM-4.7':'Z.ai','Kimi-K2.7-Code':'Synthetic','Kimi-K3 (Synthetic)':'Synthetic','Kimi-K3 (Moonshot)':'Moonshot','Gemini Flash':'Google','GPT-5.6-sol':'OpenAI','Fable-5':'Anthropic','Opus-5':'Anthropic'};
      var totals={};
      tu.tools.forEach(function(t){
        t.models.forEach(function(m){
          if(!totals[m.name]) totals[m.name]={name:m.name,tokens:0};
          totals[m.name].tokens += parseFloat(m.tokensLabel) * (m.tokensLabel.indexOf('B')>-1 ? 1000 : 1);
        });
      });
      var board=Object.keys(totals).map(function(k){return totals[k]}).filter(function(m){return m.tokens>0}).sort(function(a,b){return b.tokens-a.tokens});
      var maxTok=board.length?board[0].tokens:1;
      var fmtTok=function(t){return t >= 1000 ? (t/1000).toFixed(t>=10000?0:1).replace(/\.0$/,'') + 'B' : Math.round(t) + 'M'};
      tuHtml += '<h2 class="details-title" style="margin-top:var(--s-7)">Models, <em>side by side</em></h2>' +
        '<div class="mc-sub">Total tokens across every tool · ' + tu.period.toLowerCase() + ' · local logs</div>';
      // The podium : top three stand on the steps, the rest queue below.
      var podiumClasses=['first','second','third'];
      if(board.length>=3){
        tuHtml += '<div class="mc-podium">';
        for(var pi=0;pi<3;pi++){
          var pm=board[pi];
          tuHtml += '<div class="mc-podium-card ' + podiumClasses[pi] + '">' +
            '<span class="mc-podium-rank">' + String(pi+1).padStart(2,'0') + '</span>' +
            '<span class="mc-podium-name">' + pm.name + '</span>' +
            '<span class="mc-podium-provider">' + (MODEL_PROVIDER[pm.name]||'') + '</span>' +
            '<span class="mc-podium-tokens">' + fmtTok(pm.tokens) + '</span>' +
            '</div>';
        }
        tuHtml += '</div>';
      }
      board.forEach(function(m,i){
        if(board.length>=3 && i<3) return;
        tuHtml += '<div class="mc-row">' +
          '<div class="mc-head"><span class="mc-rank">' + String(i+1).padStart(2,'0') + '</span>' +
          '<span class="mc-name">' + m.name + '</span>' +
          '<span class="mc-provider">' + (MODEL_PROVIDER[m.name]||'') + '</span>' +
          '<span class="mc-tokens">' + fmtTok(m.tokens) + '</span></div>' +
          '<div class="mc-bar"><span class="mc-fill" style="display:block;width:' + Math.round(m.tokens/maxTok*100) + '%"></span></div>' +
          '</div>';
      });
      document.getElementById('tool-usage').innerHTML = tuHtml;
    }

    // Load What's New
    try{
      const clRes = await fetch('changelog.json?_=' + Date.now());
      if(clRes.ok){
        const cl = await clRes.json();
        allNews = groupByDay(cl.entries || []);
        renderNews();
      }
    }catch(e){}

  }catch(e){
    document.getElementById('bars-container').innerHTML = '<div style="text-align:center;color:var(--dim);padding:var(--s-5)">Still warming up…</div>';
  }
}

function groupByDay(entries){
  var days = {};
  entries.forEach(function(e){
    if(!days[e.date]) days[e.date] = [];
    days[e.date].push(e);
  });
  return Object.keys(days).sort(function(a,b){return b.localeCompare(a)}).map(function(k){
    return {date:k, items:days[k]};
  });
}

function renderNews(){
  var html = '';
  for(var i = 0; i < Math.min(visibleDays, allNews.length); i++){
    var day = allNews[i];
    var d = new Date(day.date + 'T12:00:00');
    var label = d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
    html += '<div class="tl-day"><div class="tl-day-head">' + label + '</div>';
    var seen = {};
    day.items.forEach(function(item){
      var key = item.text.replace(/<[^>]*>/g,'').substring(0, 40);
      if(seen[key]) return;
      seen[key] = true;
      html += '<div class="tl-item" title="' + (item.time || '') + '">' + item.text + '</div>';
    });
    html += '</div>';
  }
  document.getElementById('timeline').innerHTML = html;
  document.getElementById('news-more').style.display = allNews.length > visibleDays ? 'block' : 'none';
}

function loadMoreNews(){
  visibleDays += 3;
  renderNews();
}

// ── Flying cursor ──
// A fake mouse cursor appears where you clicked, glides with slight
// human wobble down to the target card, then "clicks" it: ripple
// burst + outline pulse, then fades out.
var flying = false;
function flyCursor(startX, startY, target){
  if(REDUCED) return;
  if(flying) return;
  flying = true;

  var cursor = document.getElementById('lab-cursor');
  if(!cursor){
    cursor = document.createElement('div');
    cursor.id = 'lab-cursor';
    cursor.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="#F4F1EC" stroke="#0B0B0C" stroke-width="1.5"><path d="M5 3l14 9-6.5 1.4L9 21z"/></svg><div class="ripple"></div>';
    document.body.appendChild(cursor);
  }

  var x = startX, y = startY;
  cursor.style.opacity = '1';
  cursor.style.transform = 'translate(' + x + 'px,' + y + 'px)';

  var t = 0;
  function step(){
    var r = target.getBoundingClientRect();
    // Aim slightly above card center so the cursor tip lands on it
    var tx = r.left + r.width * 0.5;
    var ty = r.top + Math.min(70, r.height * 0.35);

    // Ease toward target with a gentle sine wobble (human-ish hand motion)
    t += 0.045;
    x += (tx - x) * 0.055;
    y += (ty - y) * 0.055;
    var wobble = Math.sin(t * 3) * 3 * Math.max(0, 1 - t);

    cursor.style.transform = 'translate(' + (x + wobble) + 'px,' + y + 'px)';

    var dx = tx - x, dy = ty - y;
    if(Math.sqrt(dx*dx + dy*dy) < 8){
      // Arrived — click!
      cursor.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(.85)';
      var ripple = cursor.querySelector('.ripple');
      ripple.classList.remove('go');
      void ripple.offsetWidth; // restart animation
      ripple.classList.add('go');

      target.classList.add('flash');

      setTimeout(function(){
        cursor.style.transform += ' scale(1)';
        cursor.style.opacity = '0';
        setTimeout(function(){ target.classList.remove('flash'); flying = false; }, 1500);
      }, 300);
      return;
    }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

loadUsage();
setInterval(loadUsage, 15 * 60 * 1000);

function manualRefresh(){
  var btn = document.getElementById('refreshBtn');
  if(btn){btn.style.opacity='.5';btn.textContent='⟳ Refreshing…'}
  loadUsage().then(function(){
    if(btn){btn.style.opacity='1';btn.textContent='✓ Refreshed';setTimeout(function(){btn.textContent='↻ Refresh'},2000)}
  }).catch(function(){
    if(btn){btn.style.opacity='1';btn.textContent='↻ Refresh'}
  });
}
