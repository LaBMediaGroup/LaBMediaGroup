<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0d0c">
<title>Explore — LaB Media (prototype)</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Serif:ital@0;1&family=Space+Mono&display=swap">
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0d0c;overscroll-behavior:none;touch-action:none}
  #world{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
  #world:active{cursor:grabbing}
  :root{--ink:#f4efe6;--glass:rgba(11,13,12,.66);--line:rgba(255,255,255,.13);--orange:#f2a33a;--mono:'Space Mono',ui-monospace,monospace;--head:'Bebas Neue',sans-serif}
  #hud2{position:fixed;inset:0;pointer-events:none;color:var(--ink);font:12px/1.4 var(--mono)}
  #hud2 button,#hud2 input,#hud2 .lc-map{pointer-events:auto}
  .lc-card{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));width:min(300px,calc(100vw - 28px));
    background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;pointer-events:auto;overflow:hidden}
  .lc-chip{all:unset;box-sizing:border-box;display:flex;align-items:baseline;gap:10px;width:100%;padding:11px 14px;cursor:pointer}
  .lc-name{font:400 22px/1 var(--head);letter-spacing:.04em}
  .lc-mood{color:var(--orange);flex:1}
  .lc-chev{opacity:.6;transition:transform .25s}
  .lc-card.open .lc-chev{transform:rotate(180deg)}
  .lc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease;padding:0 14px}
  .lc-body>*{min-height:0;overflow:hidden}
  .lc-card.open .lc-body{grid-template-rows:auto;padding-bottom:12px}
  .lc-card:not(.open) .lc-body>*{display:none}
  .lc-place{margin:0 0 6px;opacity:.7}
  .lc-thought{margin:0 0 10px;font:italic 400 17px/1.25 'Instrument Serif',Georgia,serif;letter-spacing:.01em}
  .lc-plan{margin:0 0 10px;padding:0;list-style:none;counter-reset:s}
  .lc-plan li{counter-increment:s;padding:3px 0 3px 22px;position:relative;opacity:.55}
  .lc-plan li::before{content:counter(s);position:absolute;left:0;top:3px;width:15px;height:15px;border-radius:50%;border:1px solid currentColor;font-size:9px;line-height:15px;text-align:center}
  .lc-plan li.done{text-decoration:line-through;opacity:.38}
  .lc-plan li.done::before{content:'✓';background:var(--ink);color:#0b0d0c}
  .lc-plan li.now{opacity:1;color:var(--orange)}
  .lc-needs{display:grid;gap:5px;margin-bottom:8px}
  .lc-need{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:8px;font-size:11px}
  .lc-need i{height:6px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
  .lc-need b{display:block;height:100%;width:0;background:var(--orange);border-radius:9px;transition:width .8s ease}
  .lc-need[data-k=boredom] b{background:#9db8c9}.lc-need[data-k=hunger] b{background:#d9774a}
  .lc-project{margin:0;opacity:.8;font-size:11px}
  .lc-tools{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;gap:8px}
  .lc-btn{font:400 17px/1 var(--head);letter-spacing:.05em;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:10px 15px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .lc-primary{background:var(--orange);color:#0b0d0c;border-color:transparent}
  .lc-journal{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(640px,calc(100vw - 28px));margin:0;
    text-align:center;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:9px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .lc-map{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,6,6,.45);opacity:0;transition:opacity .22s}
  .lc-map.on{opacity:1}
  #hud2 [hidden]{display:none!important}
  .lc-map-panel{width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;background:#121514;border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;
    transform:translateY(14px) scale(.98);transition:transform .25s cubic-bezier(.2,.9,.3,1.2)}
  .lc-map.on .lc-map-panel{transform:none}
  .lc-map-panel header{display:flex;justify-content:space-between;align-items:center}
  .lc-map-panel header b{font:400 26px/1 var(--head);letter-spacing:.04em}
  .lc-x{all:unset;cursor:pointer;font-size:26px;line-height:1;padding:2px 8px}
  #mapSvg{width:100%;height:auto;margin:8px 0 4px;border-radius:10px;background:#3b3324}
  .m-field{fill:#4a3f2b}.m-clear{fill:#5d5139}.m-lane{stroke:#30291f;stroke-width:.5;fill:none}
  .m-pond{fill:#2c4a4f;stroke:#21363a;stroke-width:.3}.m-shed{fill:#8b7a62}
  .m-place{cursor:pointer}.m-place circle{fill:var(--ink)}.m-place text{fill:var(--ink);font:1.45px var(--mono);paint-order:stroke;stroke:#3b3324;stroke-width:.35px}
  .m-place[data-k=culvert] circle{fill:var(--orange)}
  .m-you circle{fill:#9fd0ff}.m-you path{fill:#9fd0ff}.m-coon circle{fill:var(--orange);stroke:#0b0d0c;stroke-width:.4}
  .lc-take{margin:6px 0;font:400 18px/1 var(--head);letter-spacing:.05em;opacity:.8}
  .lc-list{display:flex;flex-wrap:wrap;gap:6px}
  .lc-sheet{position:absolute;left:50%;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 52px);transform:translateX(-50%);width:min(420px,calc(100vw - 28px));
    background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px 14px;pointer-events:auto;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .lc-sheet p{margin:0 0 8px}
  .lc-sheet form{display:flex;gap:8px}
  .lc-sheet input{flex:1;min-width:0;font:13px var(--mono);color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;padding:9px 12px}
  .lc-sheet small{display:block;margin-top:6px;opacity:.6;font-size:10px}
  .lc-bubble{position:absolute;left:0;top:0;max-width:240px;background:#f4efe6;color:#14110d;border-radius:14px;padding:8px 12px;font:13px/1.3 var(--mono);
    box-shadow:0 6px 18px rgba(0,0,0,.3);pointer-events:none}
  .lc-bubble::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#f4efe6}
  #perf{position:fixed;right:14px;bottom:70px;font:10px var(--mono);color:var(--ink);opacity:.5}
  @media (max-width:700px){.lc-tools{top:auto;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 48px)}.lc-journal{border-radius:12px;font-size:11px}}
</style>
<script type="importmap">{"imports":{"three":"/pond/vendor/three/three.module.js","three/addons/":"/pond/vendor/three/addons/"}}</script>
<script defer src="sun-calc.js"></script>
<script type="module">
try {
  await import('/pond/world.js?v=25');
  await import('/pond/explore.js?v=3');
} catch (e) {
  console.error(e);
  document.documentElement.classList.add('no-world');
  document.getElementById('hud2').textContent = 'The 3D field could not start on this device.';
}
</script>
</head>
<body>
<canvas id="world" aria-label="The LaB field, walkable"></canvas>
<canvas id="boardPrint" width="800" height="1220" hidden></canvas>
<div id="hud2"></div>
<div id="perf" hidden></div>
</body>
</html>
